<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Animated SVG Frame Exporter</title>

<style>
  body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    padding:20px;
  }

  .panel{
    background:#1b1b1b;
    border:1px solid #333;
    padding:20px;
    border-radius:12px;
    max-width:900px;
    margin:auto;
  }

  button,input{
    margin:6px 0;
  }

  #frames{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
  }

  .frame{
    border:1px solid #444;
    padding:6px;
    border-radius:8px;
    background:#222;
  }

  canvas{
    background:white;
    width:120px;
    height:120px;
  }

  #preview{
    margin-top:20px;
    border:1px solid #333;
    padding:10px;
    min-height:200px;
    background:#181818;
  }
</style>
</head>
<body>

<div class="panel">
  <h2>SVG Animation Frame Exporter 😆</h2>

  <input type="file" id="fileInput" accept=".svg">

  <br>

  Duration (ms):
  <input type="number" id="duration" value="2000">

  <br>

  Frames:
  <input type="number" id="frameCount" value="12">

  <br>

  <button id="generateBtn">Generate Frames</button>

  <div id="preview"></div>

  <div id="frames"></div>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const generateBtn = document.getElementById("generateBtn");
const preview = document.getElementById("preview");
const framesContainer = document.getElementById("frames");

let svgText = "";

fileInput.addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if(!file) return;

  svgText = await file.text();

  preview.innerHTML = svgText;
});

generateBtn.addEventListener("click", async ()=>{

  if(!svgText){
    alert("upload svg dulu (-_-)");
    return;
  }

  framesContainer.innerHTML = "";

  const duration = Number(document.getElementById("duration").value);
  const frameCount = Number(document.getElementById("frameCount").value);

  for(let i=0;i<frameCount;i++){

    const t = (i/(frameCount-1))*duration;

    const canvas = await renderFrame(svgText,t);

    const wrapper = document.createElement("div");
    wrapper.className = "frame";

    const label = document.createElement("div");
    label.textContent = `${Math.round(t)}ms`;

    wrapper.appendChild(canvas);
    wrapper.appendChild(label);

    framesContainer.appendChild(wrapper);
  }

});

async function renderFrame(originalSVG,timeMs){

  const parser = new DOMParser();
  const doc = parser.parseFromString(originalSVG,"image/svg+xml");

  const svg = doc.documentElement;

  // ukuran
  const vb = svg.getAttribute("viewBox");

  let width = parseFloat(svg.getAttribute("width")) || 300;
  let height = parseFloat(svg.getAttribute("height")) || 300;

  if(vb){
    const parts = vb.split(/[\s,]+/).map(Number);

    if(!svg.getAttribute("width")) width = parts[2];
    if(!svg.getAttribute("height")) height = parts[3];
  }

  // inject ke iframe hidup
  const iframe = document.createElement("iframe");

  iframe.style.position = "fixed";
  iframe.style.left = "-9999px";

  document.body.appendChild(iframe);

  const idoc = iframe.contentDocument;

  idoc.open();
  idoc.write(`
<!DOCTYPE html>
<html>
<body style="margin:0">
${originalSVG}
</body>
</html>
  `);
  idoc.close();

  await wait(100);

  const liveSVG = idoc.querySelector("svg");

  // seek smil
  if(liveSVG.setCurrentTime){
    liveSVG.setCurrentTime(timeMs/1000);
  }

  // seek css animations
  const anims = idoc.getAnimations();

  anims.forEach(anim=>{
    try{
      anim.pause();
      anim.currentTime = timeMs;
    }catch(e){}
  });

  await raf(iframe.contentWindow);
  await raf(iframe.contentWindow);

  // ===== CRITICAL FIX =====
  // copy COMPUTED styles back into attributes

  const all = liveSVG.querySelectorAll("*");

  all.forEach(el=>{

    const computed = iframe.contentWindow.getComputedStyle(el);

    // transform
    const transform = computed.transform;

    if(transform && transform !== "none"){
      el.setAttribute("transform",transform);
    }

    // opacity
    el.setAttribute("opacity",computed.opacity);

    // fill
    if(computed.fill){
      el.setAttribute("fill",computed.fill);
    }

    // stroke
    if(computed.stroke){
      el.setAttribute("stroke",computed.stroke);
    }
  });

  const serialized = new XMLSerializer().serializeToString(liveSVG);

  const blob = new Blob([serialized],{
    type:"image/svg+xml"
  });

  const url = URL.createObjectURL(blob);

  const img = new Image();

  await new Promise((resolve,reject)=>{

    img.onload = resolve;
    img.onerror = reject;

    img.src = url;
  });

  const canvas = document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(img,0,0,width,height);

  URL.revokeObjectURL(url);

  iframe.remove();

  return canvas;
}

function wait(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function raf(win){
  return new Promise(r=>win.requestAnimationFrame(r));
}
</script>

</body>
</html>
