<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG → PNG Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ─── Design Tokens ─────────────────────────────────── */
    :root {
      --bg:        #0c0c0e;
      --surface:   #131316;
      --border:    #232328;
      --border-hi: #3a3a42;
      --accent:    #e8ff47;
      --accent-dim:#b8cc2a;
      --text:      #f0f0f0;
      --muted:     #6b6b7a;
      --danger:    #ff5555;
      --success:   #47ffb2;
      --radius:    10px;
      --mono:      'Space Mono', monospace;
      --sans:      'DM Sans', sans-serif;
    }

    /* ─── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Layout ─────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .logo span { color: var(--accent); }
    .badge {
      font-family: var(--mono);
      font-size: 0.65rem;
      background: #1e1e24;
      border: 1px solid var(--border-hi);
      padding: 2px 8px;
      border-radius: 20px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 0;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px;
      gap: 20px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-body { padding: 20px; flex: 1; }

    /* ─── Controls (spans full width) ───────────────────── */
    .controls-row {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    input[type="number"], select {
      background: var(--bg);
      border: 1px solid var(--border-hi);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      width: 110px;
      transition: border-color 0.15s;
    }
    input[type="number"]:focus, select:focus { border-color: var(--accent); }
    select { width: 150px; cursor: pointer; }
    .btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 9px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #0c0c0e; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-hi);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-group { display: flex; gap: 8px; align-items: flex-end; }

    /* ─── Drop Zone ─────────────────────────────────────── */
    .drop-zone {
      border: 2px dashed var(--border-hi);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      min-height: 180px;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(232,255,71,0.03);
    }
    .drop-zone.has-file { border-style: solid; border-color: var(--border-hi); }
    .drop-icon { font-size: 2rem; line-height: 1; }
    .drop-label {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .drop-label strong { color: var(--text); display: block; font-weight: 500; }
    #file-input { display: none; }

    /* ─── SVG Preview ───────────────────────────────────── */
    .preview-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: repeating-conic-gradient(#1a1a20 0% 25%, transparent 0% 50%) 0 0 / 18px 18px;
      border-radius: 6px;
      min-height: 220px;
      overflow: hidden;
      position: relative;
    }
    .preview-box img, .preview-box svg {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #svg-preview-container {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    #svg-preview-container svg { max-width: 100%; max-height: 280px; }

    /* ─── Animation Controls ────────────────────────────── */
    .anim-controls {
      margin-top: 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .anim-controls.visible { display: flex; }
    .anim-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .anim-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 80px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      min-width: 100px;
    }
    .anim-val {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--accent);
      min-width: 45px;
      text-align: right;
    }

    /* ─── Frame Strip ───────────────────────────────────── */
    .frame-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .frame-thumb {
      border: 2px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s;
      background: #1a1a20;
    }
    .frame-thumb:hover { border-color: var(--accent); }
    .frame-thumb img { display: block; width: 64px; height: 64px; object-fit: contain; }
    .frame-thumb .frame-num {
      font-family: var(--mono);
      font-size: 0.55rem;
      color: var(--muted);
      text-align: center;
      padding: 2px 0;
    }

    /* ─── Output Panel ──────────────────────────────────── */
    #output-canvas { display: none; }
    .output-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      background: repeating-conic-gradient(#1a1a20 0% 25%, transparent 0% 50%) 0 0 / 18px 18px;
      border-radius: 6px;
      overflow: hidden;
    }
    #output-img {
      max-width: 100%;
      max-height: 280px;
      object-fit: contain;
      display: none;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .empty-icon { font-size: 1.8rem; opacity: 0.4; }

    /* ─── Status Bar ─────────────────────────────────────── */
    .status-bar {
      grid-column: 1 / -1;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      padding: 10px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--success); }
    .status-dot.err { background: var(--danger); }
    .status-dot.busy {
      background: var(--accent);
      animation: pulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes pulse { to { opacity: 0.3; } }

    /* ─── Toast ──────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 8px;
      padding: 10px 20px;
      font-family: var(--mono);
      font-size: 0.78rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── Responsive ─────────────────────────────────────── */
    @media (max-width: 750px) {
      main { grid-template-columns: 1fr; padding: 16px; }
      .controls-row { grid-column: 1; }
      .status-bar { grid-column: 1; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">SVG<span>→</span>PNG</div>
  <span class="badge">Converter</span>
</header>

<main>

  <!-- ── Controls Row ── -->
  <div class="controls-row">
    <div class="field">
      <label>Width (px)</label>
      <input type="number" id="out-width" value="512" min="1" max="8192" />
    </div>
    <div class="field">
      <label>Height (px)</label>
      <input type="number" id="out-height" value="512" min="1" max="8192" />
    </div>
    <div class="field">
      <label>Scale</label>
      <select id="out-scale">
        <option value="1">1× (original)</option>
        <option value="2" selected>2× (retina)</option>
        <option value="3">3× (hi-res)</option>
        <option value="4">4×</option>
      </select>
    </div>
    <div class="field">
      <label>Background</label>
      <select id="bg-mode">
        <option value="transparent">Transparent</option>
        <option value="white">White</option>
        <option value="black">Black</option>
        <option value="custom">Custom…</option>
      </select>
    </div>
    <input type="color" id="custom-bg" value="#ffffff" style="display:none;width:40px;height:36px;border:none;background:none;cursor:pointer;border-radius:6px;" />
    <div class="btn-group">
      <button class="btn btn-primary" id="btn-convert" disabled>Convert</button>
      <button class="btn btn-secondary" id="btn-download" disabled>Download PNG</button>
    </div>
  </div>

  <!-- ── Input Panel ── -->
  <div class="panel">
    <div class="panel-header">
      <span>Input · SVG</span>
      <span id="svg-info" style="color:var(--accent);font-size:0.65rem;"></span>
    </div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:16px;">

      <div class="drop-zone" id="drop-zone">
        <div class="drop-icon">⬡</div>
        <div class="drop-label">
          <strong>Drop SVG file here</strong>
          or click to browse
        </div>
        <input type="file" id="file-input" accept=".svg,image/svg+xml" />
      </div>

      <div class="preview-box" style="flex:1;min-height:200px;">
        <div id="svg-preview-container">
          <div class="empty-state">
            <div class="empty-icon">⬡</div>
            <span>No SVG loaded</span>
          </div>
        </div>
      </div>

      <!-- Animation Controls (hidden until animated SVG detected) -->
      <div class="anim-controls" id="anim-controls">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div style="font-family:var(--mono);font-size:0.65rem;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;">
            Animated SVG Detected
          </div>
          <div id="detected-dur-badge" style="font-family:var(--mono);font-size:0.65rem;color:var(--muted);background:var(--bg);border:1px solid var(--border-hi);padding:2px 10px;border-radius:20px;"></div>
        </div>

        <div class="anim-row">
          <span class="anim-label">Preview at</span>
          <input type="range" id="frame-time" min="0" max="5000" step="10" value="0" />
          <span class="anim-val" id="frame-time-val">0 ms</span>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="field">
            <label>Total Duration (ms)</label>
            <input type="number" id="anim-duration" value="1000" min="100" max="60000" step="100" style="width:100%;" />
          </div>
          <div class="field">
            <label>Frame Count</label>
            <input type="number" id="frame-count" value="24" min="2" max="240" step="1" style="width:100%;" />
          </div>
        </div>

        <div style="font-family:var(--mono);font-size:0.63rem;color:var(--muted);line-height:1.6;" id="frame-calc-info">
          24 frames · ~41.7 ms/frame
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-secondary" id="btn-generate-frames" style="font-size:0.7rem;padding:6px 14px;">
            Preview Strip
          </button>
          <button class="btn btn-primary" id="btn-export-all" style="font-size:0.7rem;padding:6px 14px;">
            Export All Frames (ZIP)
          </button>
        </div>
        <div class="frame-strip" id="frame-strip"></div>
      </div>

    </div>
  </div>

  <!-- ── Output Panel ── -->
  <div class="panel">
    <div class="panel-header">
      <span>Output · PNG</span>
      <span id="png-info" style="color:var(--muted);font-size:0.65rem;"></span>
    </div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:16px;">
      <div class="output-preview">
        <img id="output-img" alt="PNG output" />
        <div class="empty-state" id="output-empty">
          <div class="empty-icon">◻</div>
          <span>PNG will appear here</span>
        </div>
      </div>
      <canvas id="output-canvas"></canvas>
    </div>
  </div>

  <!-- ── Status Bar ── -->
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-msg">Ready. Drop an SVG to begin.</span>
  </div>

</main>

<div class="toast" id="toast"></div>

<!-- ─── Scripts ──────────────────────────────────────── -->
<script>
/**
 * SVG → PNG Converter
 * ───────────────────
 * Module layout:
 *   FileLoader   – handles file drag-drop / input
 *   SVGAnalyzer  – detects animation, reads viewBox/dimensions
 *   Renderer     – rasterises SVG → canvas at any time offset
 *   FrameCapture – generates frame strips + ZIP export
 *   UI           – wires DOM, delegates to modules above
 *
 * Add new modules (e.g. GIF encoder, AVIF, WEBP) without
 * touching existing ones — just import and connect in UI.
 */

/* ═══════════════════════════════════════════════════════
   MODULE: FileLoader
   Responsibility: accept SVG via drag-drop or <input>
   ═══════════════════════════════════════════════════════ */
const FileLoader = (() => {
  let _onLoad = null; // callback(svgText, fileName)

  function init(dropZoneEl, fileInputEl, onLoad) {
    _onLoad = onLoad;

    dropZoneEl.addEventListener('click', () => fileInputEl.click());
    fileInputEl.addEventListener('change', e => {
      if (e.target.files[0]) _readFile(e.target.files[0]);
    });

    dropZoneEl.addEventListener('dragover', e => {
      e.preventDefault();
      dropZoneEl.classList.add('drag-over');
    });
    dropZoneEl.addEventListener('dragleave', () => {
      dropZoneEl.classList.remove('drag-over');
    });
    dropZoneEl.addEventListener('drop', e => {
      e.preventDefault();
      dropZoneEl.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && (file.type === 'image/svg+xml' || file.name.endsWith('.svg'))) {
        _readFile(file);
      } else {
        UI.status('Only SVG files are accepted.', 'err');
      }
    });
  }

  function _readFile(file) {
    const reader = new FileReader();
    reader.onload = e => _onLoad(e.target.result, file.name);
    reader.readAsText(file);
  }

  return { init };
})();


/* ═══════════════════════════════════════════════════════
   MODULE: SVGAnalyzer
   Responsibility: parse SVG, detect animation & measure
   true total duration from SMIL + CSS sources.
   ═══════════════════════════════════════════════════════ */
const SVGAnalyzer = (() => {

  function analyze(svgText) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgText, 'image/svg+xml');
    const svgEl = doc.documentElement;

    // ── Dimensions ──────────────────────────────────────
    const viewBox = svgEl.getAttribute('viewBox');
    let w = parseFloat(svgEl.getAttribute('width'))  || 0;
    let h = parseFloat(svgEl.getAttribute('height')) || 0;
    if (viewBox) {
      const parts = viewBox.split(/[\s,]+/).map(Number);
      if (!w) w = parts[2] || 300;
      if (!h) h = parts[3] || 300;
    }
    if (!w) w = 300;
    if (!h) h = 300;

    // ── SMIL animation detection & duration ─────────────
    const smilTags = ['animate', 'animateTransform', 'animateMotion', 'set'];
    const smilEls  = smilTags.flatMap(t => [...doc.querySelectorAll(t)]);
    const hasSMIL  = smilEls.length > 0;
    let smilDurMs  = 0;

    for (const el of smilEls) {
      const end = _smilEndMs(el);
      if (end > smilDurMs) smilDurMs = end;
    }

    // ── CSS animation detection & duration ──────────────
    const styleBlocks = [...doc.querySelectorAll('style')].map(s => s.textContent).join('\n');
    const hasCSSAnim  = /animation[\s\S]*?:|@keyframes/.test(styleBlocks);
    let cssDurMs = 0;

    if (hasCSSAnim) {
      // Extract all animation shorthand or animation-duration values
      // Pattern: animation: name Xs Ys / animation-duration: Xs
      const durRe = /animation(?:-duration)?\s*:[^;}"']*?([\d.]+)\s*s/gi;
      const delayRe = /animation(?:-delay)?\s*:[^;}"']*?([\d.]+)\s*s/gi;
      const iterRe = /animation(?:-iteration-count)?\s*:[^;}"']*?(\d+|infinite)/gi;

      let m;
      const durations = [];
      const delays    = [];
      const iters     = [];

      while ((m = durRe.exec(styleBlocks))   !== null) durations.push(parseFloat(m[1]) * 1000);
      while ((m = delayRe.exec(styleBlocks)) !== null) delays.push(parseFloat(m[1]) * 1000);
      while ((m = iterRe.exec(styleBlocks))  !== null) {
        iters.push(m[1] === 'infinite' ? 1 : parseInt(m[1], 10)); // treat infinite as 1 cycle
      }

      // Also check ms values
      const durRems = /animation(?:-duration)?\s*:[^;}"']*?([\d.]+)\s*ms/gi;
      while ((m = durRems.exec(styleBlocks)) !== null) durations.push(parseFloat(m[1]));

      if (durations.length > 0) {
        for (let i = 0; i < durations.length; i++) {
          const iter  = iters[i]  || 1;
          const delay = delays[i] || 0;
          const total = delay + durations[i] * iter;
          if (total > cssDurMs) cssDurMs = total;
        }
      }
    }

    const isAnimated  = hasSMIL || hasCSSAnim;
    const detectedDurMs = Math.max(smilDurMs, cssDurMs) || (isAnimated ? 2000 : 0);

    return { width: w, height: h, isAnimated, detectedDurMs };
  }

  // ── SMIL helpers ───────────────────────────────────────

  /**
   * Compute the end time (ms) of a single SMIL element,
   * accounting for begin, dur, repeatCount, repeatDur, end.
   */
  function _smilEndMs(el) {
    const dur         = _smilTimeMs(el.getAttribute('dur'))         || 0;
    const begin       = _smilTimeMs(el.getAttribute('begin'))       || 0;
    const repeatDur   = _smilTimeMs(el.getAttribute('repeatDur'));
    const repeatCount = el.getAttribute('repeatCount');
    const endAttr     = _smilTimeMs(el.getAttribute('end'));

    let active = dur;

    if (repeatDur != null) {
      active = repeatDur;
    } else if (repeatCount != null) {
      if (repeatCount === 'indefinite') {
        active = dur * 3; // assume 3 cycles for indefinite
      } else {
        active = dur * (parseFloat(repeatCount) || 1);
      }
    }

    const computed = begin + active;
    return endAttr != null ? Math.min(computed, endAttr) : computed;
  }

  /**
   * Parse a SMIL clock value into milliseconds.
   * Supports: "2s", "500ms", "00:00:02", "2.5", numeric
   */
  function _smilTimeMs(val) {
    if (!val || val === 'indefinite' || val === 'media') return null;
    val = val.trim();
    // HH:MM:SS or MM:SS
    if (/^\d+:\d+:\d+(\.\d+)?$/.test(val)) {
      const [h, m, s] = val.split(':').map(parseFloat);
      return (h * 3600 + m * 60 + s) * 1000;
    }
    if (/^\d+:\d+(\.\d+)?$/.test(val)) {
      const [m, s] = val.split(':').map(parseFloat);
      return (m * 60 + s) * 1000;
    }
    if (/ms$/.test(val)) return parseFloat(val);
    if (/s$/.test(val))  return parseFloat(val) * 1000;
    if (/min$/.test(val)) return parseFloat(val) * 60000;
    const n = parseFloat(val);
    return isNaN(n) ? null : n * 1000;
  }

  return { analyze };
})();


/* ═══════════════════════════════════════════════════════
   MODULE: Renderer
   Responsibility: render SVG → canvas at an exact time.

   WHY IFRAME:
   The <img> tag approach always renders t=0 because browsers
   freeze all animations when an SVG is loaded as an image —
   no attribute trick or CSS injection can change this.

   The only way to truly seek an SVG animation is to:
     1. Mount the SVG in a live DOM (hidden iframe).
     2. Let the browser run the animation engine.
     3. Seek using:
        - svgDoc.setCurrentTime(t) for SMIL
        - animation.currentTime = t for CSS (Web Animations API)
     4. Re-serialize the seeked SVG DOM back to a string,
        then draw it to canvas via <img> blob URL — this
        captures the static visual at that exact frame.

   The iframe is reused across frames (persistent) for speed.
   ═══════════════════════════════════════════════════════ */
const Renderer = (() => {

  // Persistent hidden iframe — created once, reused for all renders
  let _iframe = null;
  let _iframeReady = false;
  let _pendingResolve = null;

  function _ensureIframe() {
    if (_iframe) return Promise.resolve();
    return new Promise(resolve => {
      _iframe = document.createElement('iframe');
      _iframe.style.cssText = [
        'position:fixed', 'top:0', 'left:0',
        'width:1px', 'height:1px',
        'opacity:0', 'pointer-events:none',
        'border:none', 'overflow:hidden',
      ].join(';');
      _iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      _iframe.onload = () => { _iframeReady = true; resolve(); };
      document.body.appendChild(_iframe);
      // Write a blank page so we have a document to work with
      _iframe.srcdoc = '<!DOCTYPE html><html><body></body></html>';
    });
  }

  /**
   * Render svgText to a canvas at timeMs.
   * Returns Promise<HTMLCanvasElement>
   */
  async function render(svgText, outW, outH, scale, bgColor, timeMs = 0) {
    await _ensureIframe();

    // Step 1: inject the SVG into the iframe body
    const iDoc  = _iframe.contentDocument;
    const iWin  = _iframe.contentWindow;

    // Size the iframe to match SVG so coordinates are correct
    _iframe.style.width  = outW + 'px';
    _iframe.style.height = outH + 'px';

    iDoc.open();
    iDoc.write(`<!DOCTYPE html><html><head><style>
      html,body{margin:0;padding:0;width:${outW}px;height:${outH}px;overflow:hidden;background:transparent;}
      svg{display:block;width:${outW}px!important;height:${outH}px!important;}
    </style></head><body>${svgText}</body></html>`);
    iDoc.close();

    // Step 2: wait for the SVG to be fully parsed and animations initialised
    await _waitForLoad(iWin);

    // Step 3: seek to timeMs
    const timeSec = timeMs / 1000;

    // SMIL: use setCurrentTime on the SVG document
    const svgEl = iDoc.querySelector('svg');
    if (svgEl && typeof svgEl.setCurrentTime === 'function') {
      svgEl.setCurrentTime(timeSec);
    }

    // CSS: Web Animations API — pause all and seek
    if (iDoc.getAnimations) {
      for (const anim of iDoc.getAnimations()) {
        try {
          anim.pause();
          anim.currentTime = timeMs;
        } catch (e) { /* some animations may not be seekable */ }
      }
    }
    // Also try on individual elements (some browsers need this)
    if (svgEl) {
      for (const el of svgEl.querySelectorAll('*')) {
        if (el.getAnimations) {
          for (const anim of el.getAnimations()) {
            try { anim.pause(); anim.currentTime = timeMs; } catch (e) {}
          }
        }
      }
    }

    // Step 4: give the browser one frame to apply the seek
    await _raf(iWin);
    await _raf(iWin); // two rAFs for reliability

    // Step 5: serialize the current SVG DOM state back to a string
    //         so we can draw it via <img> (scripts-off path = safe)
    const serializer = new XMLSerializer();
    const seekedSVG  = serializer.serializeToString(svgEl);

    // Step 6: draw to canvas
    const canvas  = document.createElement('canvas');
    canvas.width  = outW * scale;
    canvas.height = outH * scale;
    const ctx = canvas.getContext('2d');

    if (bgColor && bgColor !== 'transparent') {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    await _drawSVGToCanvas(ctx, seekedSVG, canvas.width, canvas.height);
    return canvas;
  }

  /** Wait for iframe window load (or immediate if already loaded) */
  function _waitForLoad(iWin) {
    return new Promise(resolve => {
      if (iWin.document.readyState === 'complete') {
        // Still yield one tick so SVG element is in DOM
        setTimeout(resolve, 20);
      } else {
        iWin.addEventListener('load', () => setTimeout(resolve, 20), { once: true });
      }
    });
  }

  /** requestAnimationFrame inside the iframe window */
  function _raf(iWin) {
    return new Promise(resolve => iWin.requestAnimationFrame(resolve));
  }

  /** Draw an SVG string to a canvas context at target dimensions */
  function _drawSVGToCanvas(ctx, svgString, w, h) {
    return new Promise((resolve, reject) => {
      // Ensure the SVG has explicit width/height so browsers render it correctly
      const sized = svgString
        .replace(/(<svg\b[^>]*)\bwidth\s*=\s*["'][^"']*["']/i,  '$1')
        .replace(/(<svg\b[^>]*)\bheight\s*=\s*["'][^"']*["']/i, '$1')
        .replace(/(<svg\b)/i, `$1 width="${w}" height="${h}" `);

      const blob = new Blob([sized], { type: 'image/svg+xml;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const img  = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve();
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('Failed to draw serialized SVG frame to canvas'));
      };
      img.src = url;
    });
  }

  /** Destroy and recreate the iframe (call when loading a new SVG) */
  function reset() {
    if (_iframe) {
      _iframe.remove();
      _iframe = null;
      _iframeReady = false;
    }
  }

  return { render, reset };
})();


/* ═══════════════════════════════════════════════════════
   MODULE: FrameCapture
   Responsibility: generate N frames, offer ZIP download
   ═══════════════════════════════════════════════════════ */
const FrameCapture = (() => {

  /**
   * Generate frameCount evenly-spaced frames over durationMs.
   * Frame 0 = t=0, frame N-1 = t=durationMs.
   * @param {Function} [onProgress] called after each frame
   * Returns array of { canvas, timeMs, index }
   */
  async function generateFrames(svgText, outW, outH, scale, bgColor, durationMs, frameCount, onProgress) {
    const frames = [];
    for (let i = 0; i < frameCount; i++) {
      // Distribute evenly: 0ms … durationMs (inclusive on both ends)
      const t = (frameCount === 1)
        ? 0
        : Math.round((i / (frameCount - 1)) * durationMs);
      const canvas = await Renderer.render(svgText, outW, outH, scale, bgColor, t);
      frames.push({ canvas, timeMs: t, index: i });
      if (onProgress) onProgress(i + 1, frameCount);
    }
    return frames;
  }

  /**
   * Pack frames as individual PNGs into a ZIP and trigger download.
   * Uses a tiny self-contained ZIP builder (no external deps).
   */
  async function exportZip(frames, baseName) {
    const files = await Promise.all(frames.map(async ({ canvas, timeMs, index }) => {
      const blob = await canvasToBlob(canvas);
      const data = await blob.arrayBuffer();
      const i    = index != null ? index : frames.indexOf(frames.find(f => f.timeMs === timeMs));
      return {
        name: `${baseName}_f${String(i + 1).padStart(4, '0')}_${timeMs}ms.png`,
        data: new Uint8Array(data),
      };
    }));

    const zip = buildZip(files);
    const zipBlob = new Blob([zip], { type: 'application/zip' });
    triggerDownload(zipBlob, `${baseName}_frames.zip`);
  }

  function canvasToBlob(canvas) {
    return new Promise(res => canvas.toBlob(res, 'image/png'));
  }

  // ── Minimal ZIP builder ──────────────────────────────
  // Implements STORE (no compression) ZIP — tiny and dependency-free.
  function buildZip(files) {
    const enc = new TextEncoder();
    const localHeaders = [];
    const centralDir = [];
    let offset = 0;

    for (const file of files) {
      const nameBytes = enc.encode(file.name);
      const crc = crc32(file.data);
      const size = file.data.length;

      // Local file header
      const lh = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);   // signature
      lv.setUint16(4, 20, true);             // version needed
      lv.setUint16(6, 0, true);              // flags
      lv.setUint16(8, 0, true);              // compression (STORE)
      lv.setUint16(10, 0, true);             // mod time
      lv.setUint16(12, 0, true);             // mod date
      lv.setUint32(14, crc, true);           // CRC-32
      lv.setUint32(18, size, true);          // compressed
      lv.setUint32(22, size, true);          // uncompressed
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);             // extra
      lh.set(nameBytes, 30);

      localHeaders.push(lh, file.data);

      // Central directory entry
      const cd = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);   // signature
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);

      centralDir.push(cd);
      offset += lh.length + size;
    }

    const cdSize = centralDir.reduce((a, c) => a + c.length, 0);
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return concat([...localHeaders, ...centralDir, eocd]);
  }

  function concat(parts) {
    const total = parts.reduce((a, b) => a + b.length, 0);
    const out = new Uint8Array(total);
    let off = 0;
    for (const p of parts) { out.set(p, off); off += p.length; }
    return out;
  }

  // CRC-32 table
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let j = 0; j < 8; j++) c = (c & 1) ? 0xedb88320 ^ (c >>> 1) : (c >>> 1);
      t[i] = c;
    }
    return t;
  })();

  function crc32(data) {
    let c = 0xffffffff;
    for (const byte of data) c = CRC_TABLE[(c ^ byte) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function triggerDownload(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  return { generateFrames, exportZip };
})();


/* ═══════════════════════════════════════════════════════
   MODULE: UI
   Responsibility: wire DOM events, coordinate modules
   ═══════════════════════════════════════════════════════ */
const UI = (() => {
  // State
  let _svgText  = null;
  let _fileName = 'output';
  let _meta     = null; // SVGAnalyzer result
  let _lastCanvas = null;

  // DOM refs
  const $ = id => document.getElementById(id);
  const dropZone        = $('drop-zone');
  const fileInput       = $('file-input');
  const svgPreview      = $('svg-preview-container');
  const svgInfo         = $('svg-info');
  const animControls    = $('anim-controls');
  const frameTimeEl     = $('frame-time');
  const frameTimeVal    = $('frame-time-val');
  const animDurEl       = $('anim-duration');
  const frameCountEl    = $('frame-count');
  const frameCalcInfo   = $('frame-calc-info');
  const detectedBadge   = $('detected-dur-badge');
  const btnConvert      = $('btn-convert');
  const btnDownload     = $('btn-download');
  const btnGenFrames    = $('btn-generate-frames');
  const btnExportAll    = $('btn-export-all');
  const frameStrip      = $('frame-strip');
  const outW            = $('out-width');
  const outH            = $('out-height');
  const outScale        = $('out-scale');
  const bgMode          = $('bg-mode');
  const customBg        = $('custom-bg');
  const outputImg       = $('output-img');
  const outputEmpty     = $('output-empty');
  const pngInfo         = $('png-info');

  function init() {
    FileLoader.init(dropZone, fileInput, _onSVGLoaded);

    btnConvert.addEventListener('click',   _convertCurrent);
    btnDownload.addEventListener('click',  _downloadPNG);
    btnGenFrames.addEventListener('click', _generateStrip);
    btnExportAll.addEventListener('click', _exportAllFrames);

    // Preview scrubber
    frameTimeEl.addEventListener('input', () => {
      const t = +frameTimeEl.value;
      frameTimeVal.textContent = `${t} ms`;
    });

    // When duration or frame count changes, update calc info
    [animDurEl, frameCountEl].forEach(el =>
      el.addEventListener('input', _updateFrameCalc)
    );

    bgMode.addEventListener('change', () => {
      customBg.style.display = bgMode.value === 'custom' ? 'block' : 'none';
    });
  }

  // ── Handlers ────────────────────────────────────────

  function _onSVGLoaded(svgText, fileName) {
    Renderer.reset(); // clear iframe from previous file
    _svgText  = svgText;
    _fileName = fileName.replace(/\.svg$/i, '');
    _meta     = SVGAnalyzer.analyze(svgText);

    // Update drop zone label
    dropZone.classList.add('has-file');
    dropZone.querySelector('.drop-label').innerHTML =
      `<strong>${fileName}</strong>${_meta.width} × ${_meta.height} px`;

    // Show live animated preview via <img> (plays in browser)
    svgPreview.innerHTML = '';
    const blob = new Blob([svgText], { type: 'image/svg+xml' });
    const url  = URL.createObjectURL(blob);
    const img  = new Image();
    img.onload = () => URL.revokeObjectURL(url);
    img.src = url;
    img.style.cssText = 'max-width:100%;max-height:280px;';
    svgPreview.appendChild(img);

    // Header info
    const animTag = _meta.isAnimated
      ? ` · animated · ${_meta.detectedDurMs}ms`
      : '';
    svgInfo.textContent = `${_meta.width}×${_meta.height}${animTag}`;

    // Sync output size
    outW.value = _meta.width;
    outH.value = _meta.height;

    // Animation panel
    if (_meta.isAnimated) {
      animControls.classList.add('visible');
      frameStrip.innerHTML = '';

      // Auto-populate detected duration
      const dur = _meta.detectedDurMs || 1000;
      animDurEl.value = dur;
      frameTimeEl.max = dur;
      frameTimeEl.value = 0;
      frameTimeVal.textContent = '0 ms';

      detectedBadge.textContent = `auto-detected: ${dur} ms`;
      _updateFrameCalc();
    } else {
      animControls.classList.remove('visible');
    }

    btnConvert.disabled = false;
    status('SVG loaded. Click Convert to render.', 'ok');
  }

  async function _convertCurrent() {
    if (!_svgText) return;
    status('Rendering…', 'busy');
    btnConvert.disabled = true;
    try {
      const canvas = await Renderer.render(
        _svgText,
        +outW.value, +outH.value, +outScale.value,
        _getBgColor(),
        +frameTimeEl.value
      );
      _lastCanvas = canvas;
      _showOutput(canvas);
      btnDownload.disabled = false;
      status(`Done — ${canvas.width}×${canvas.height}px PNG ready.`, 'ok');
    } catch (err) {
      status(`Error: ${err.message}`, 'err');
    } finally {
      btnConvert.disabled = false;
    }
  }

  function _downloadPNG() {
    if (!_lastCanvas) return;
    _lastCanvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${_fileName}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast('PNG downloaded!');
    }, 'image/png');
  }

  async function _generateStrip() {
    if (!_svgText) return;
    const dur   = _getDuration();
    const count = Math.min(+frameCountEl.value || 12, 24); // cap strip at 24 thumbs
    status(`Generating ${count}-frame strip…`, 'busy');
    btnGenFrames.disabled = true;
    frameStrip.innerHTML = '';

    try {
      const frames = await FrameCapture.generateFrames(
        _svgText, +outW.value, +outH.value, 1,
        _getBgColor(), dur, count
      );
      for (const { canvas, timeMs } of frames) {
        const thumb = document.createElement('div');
        thumb.className = 'frame-thumb';
        const img = new Image();
        img.src = canvas.toDataURL('image/png');
        const num = document.createElement('div');
        num.className = 'frame-num';
        num.textContent = `${timeMs}ms`;
        thumb.appendChild(img);
        thumb.appendChild(num);
        thumb.addEventListener('click', () => {
          _showOutput(canvas);
          _lastCanvas = canvas;
          btnDownload.disabled = false;
          frameTimeEl.value = timeMs;
          frameTimeVal.textContent = `${timeMs} ms`;
          status(`Previewing frame at ${timeMs}ms`, 'ok');
        });
        frameStrip.appendChild(thumb);
      }
      status(`Strip ready — ${count} frames over ${dur}ms. Click any frame to preview.`, 'ok');
    } catch (err) {
      status(`Error: ${err.message}`, 'err');
    } finally {
      btnGenFrames.disabled = false;
    }
  }

  async function _exportAllFrames() {
    if (!_svgText) return;
    const dur   = _getDuration();
    const count = +frameCountEl.value || 24;
    if (count < 2) { status('Frame count must be at least 2.', 'err'); return; }

    status(`Rendering ${count} frames over ${dur}ms…`, 'busy');
    btnExportAll.disabled = true;

    // Show progress in status
    let done = 0;
    const onProgress = () => {
      done++;
      status(`Rendering frame ${done}/${count}…`, 'busy');
    };

    try {
      const frames = await FrameCapture.generateFrames(
        _svgText, +outW.value, +outH.value, +outScale.value,
        _getBgColor(), dur, count,
        onProgress
      );
      status('Packing ZIP…', 'busy');
      await FrameCapture.exportZip(frames, _fileName);
      toast(`${count} frames exported!`);
      status(`ZIP with ${count} PNGs downloaded (${dur}ms, ~${Math.round(dur/count)}ms/frame).`, 'ok');
    } catch (err) {
      status(`Error: ${err.message}`, 'err');
    } finally {
      btnExportAll.disabled = false;
    }
  }

  // ── Helpers ─────────────────────────────────────────

  function _getDuration() {
    return Math.max(+animDurEl.value || 1000, 1);
  }

  function _getBgColor() {
    const m = bgMode.value;
    if (m === 'transparent') return 'transparent';
    if (m === 'white') return '#ffffff';
    if (m === 'black') return '#000000';
    return customBg.value;
  }

  function _showOutput(canvas) {
    outputImg.src = canvas.toDataURL('image/png');
    outputImg.style.display = 'block';
    outputEmpty.style.display = 'none';
    pngInfo.textContent = `${canvas.width}×${canvas.height}px`;
  }

  function _updateFrameCalc() {
    const dur   = +animDurEl.value || 1000;
    const count = +frameCountEl.value || 24;
    const step  = (count > 1) ? (dur / (count - 1)) : dur;
    frameCalcInfo.textContent =
      `${count} frames · ${step.toFixed(1)} ms/frame · total ${dur}ms`;
    // Keep scrubber max in sync
    frameTimeEl.max = dur;
    if (+frameTimeEl.value > dur) {
      frameTimeEl.value = dur;
      frameTimeVal.textContent = `${dur} ms`;
    }
  }

  // ── Public ──────────────────────────────────────────

  function status(msg, type = '') {
    $('status-msg').textContent = msg;
    const dot = $('status-dot');
    dot.className = 'status-dot' + (type ? ` ${type}` : '');
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  return { init, status, toast };
})();

// ── Boot ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => UI.init());
</script>
</body>
</html>
